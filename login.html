<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shooping Cart || Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/all.css">
</head>
<body>
   <header>
    <div class="container">
        <div class="header-content">
            <a href="index.html" class="brand">Shooping</a>
            <nav>
                <ul id="links">
                    <li><a href="login.html">Sign In</a></li>
                    <li><a href="register.html">Sign Up</a></li>
                </ul>
                <ul id="user_info">
                    <li><a href="#" id="user"></a></li>
                </ul>
            </nav>
        </div>
    </div>
   </header>
   <section class="section-form">
    <h2>Login Page</h2>
    <form>
        <input type="text" placeholder="Enter Your UserName" id="username">
        <div class="box">
            <input type="password" placeholder="Enter Your Password" id="password">
            <input type="checkbox" id="show">
            <label for="show" class="eye1"><i class="fa-solid fa-eye"></i></label>
            <label for="show" class="eye2"><i class="fa-solid fa-eye-slash"></i></label>
        </div>
        <input type="submit" id="sign_in">
    </form>
   </section>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="JS/login.js"></script>
</body>
</html>
